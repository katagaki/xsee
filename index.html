<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="topbar-name">X Simulator</span>
    <a class="topbar-link" href="https://x.com/i/under_the_hood" target="_blank" rel="noopener">Under the Hood</a>
    <select class="lang-picker" id="langPicker" aria-label="Language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab tab--active" role="tab" aria-selected="true" data-tab="simulator" data-i18n="tab.simulator">Simulator</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="weights" data-i18n="tab.weights">Weights</button>
  </nav>

  <main>
    <!-- ============ SIMULATOR ============ -->
    <section id="panel-simulator" class="panel" role="tabpanel">
      <div class="layout">
        <aside class="controls">
          <h2 class="section-title" data-i18n="section.account">Account</h2>
          <div class="field">
            <label for="followers" data-i18n="field.followers">Followers</label>
            <input type="number" id="followers" min="0" max="100000000" value="1250">
          </div>
          <div class="field">
            <label for="following" data-i18n="field.following">Following</label>
            <input type="number" id="following" min="0" max="100000000" value="480">
          </div>

          <h2 class="section-title" data-i18n="section.sim">Simulation</h2>
          <div class="field">
            <label for="duration"><span data-i18n="field.duration">Duration</span> <output id="durationValue">2:00</output></label>
            <input type="range" id="duration" min="30" max="1440" step="30" value="120">
          </div>
          <div class="field">
            <label for="speed"><span data-i18n="field.speed">Speed</span> <output id="speedValue">5×</output></label>
            <input type="range" id="speed" min="0" max="6" step="1" value="2">
          </div>

          <h2 class="section-title" data-i18n="section.post">Post content</h2>
          <div class="field">
            <label for="photos"><span data-i18n="field.photos">Photos</span> <output id="photosValue">0</output></label>
            <input type="range" id="photos" min="0" max="4" step="1" value="0">
          </div>
          <div class="check">
            <label for="hasVideo" data-i18n="field.video">Video</label>
            <input type="checkbox" id="hasVideo">
          </div>
          <div class="check">
            <label for="hasLink" data-i18n="field.link">Link</label>
            <input type="checkbox" id="hasLink">
          </div>

          <h2 class="section-title" data-i18n="section.rates">Negative feedback rates</h2>
          <div class="field">
            <label for="rateReport"><span data-i18n="action.report">Report</span> <output id="rateReportValue">0.000%</output></label>
            <input type="range" id="rateReport" min="0" max="100" step="1" value="0">
          </div>
          <div class="field">
            <label for="rateBlock"><span data-i18n="rate.block">Block</span> <output id="rateBlockValue">0.000%</output></label>
            <input type="range" id="rateBlock" min="0" max="100" step="1" value="0">
          </div>
          <div class="field">
            <label for="rateMute"><span data-i18n="rate.mute">Mute</span> <output id="rateMuteValue">0.000%</output></label>
            <input type="range" id="rateMute" min="0" max="100" step="1" value="0">
          </div>
          <div class="field">
            <label for="rateNotInterested"><span data-i18n="action.notInterested">Not interested</span> <output id="rateNotInterestedValue">0.005%</output></label>
            <input type="range" id="rateNotInterested" min="0" max="100" step="1" value="1">
          </div>

          <div class="actions">
            <button id="randomizeRates" class="btn btn--secondary" data-i18n="button.randomize">Randomize rates</button>
            <button id="run" class="btn btn--primary" data-i18n="button.run">Run simulation</button>
          </div>
        </aside>

        <div class="results">
          <div class="clock" id="clock" hidden>
            <span class="clock-time" id="clockTime">0:00:00</span>
            <span class="clock-speed" id="clockSpeed">5×</span>
            <div class="clock-bar"><div class="clock-fill" id="clockFill"></div></div>
          </div>
          <div class="stats" id="stats" hidden>
            <div class="stat"><span class="stat-label" data-i18n="stat.views">Views</span><span class="stat-value" id="statViews">-</span></div>
            <div class="stat"><span class="stat-label" data-i18n="stat.engagements">Engagements</span><span class="stat-value" id="statEngagements">-</span></div>
            <div class="stat"><span class="stat-label" data-i18n="stat.followers">New followers</span><span class="stat-value" id="statFollowers">-</span></div>
            <div class="stat"><span class="stat-label" data-i18n="stat.score">Score</span><span class="stat-value" id="statScore">-</span></div>
          </div>
          <div class="results-grid">
            <div class="results-main">
              <p class="empty" data-i18n="feed.empty">Start a simulation to see how your post performs.</p>
              <article class="post-card" id="postCard" hidden>
                <div class="post-head">
                  <span class="post-author" data-i18n="post.you">Your post</span>
                  <span class="post-meta" id="postMeta"></span>
                </div>
                <div class="post-score-row">
                  <span id="postScore" class="post-score-value">0.00</span>
                  <span id="postScoreLabel" class="post-score-label"></span>
                </div>
                <svg id="sparkline" viewBox="0 0 300 60" preserveAspectRatio="none" aria-hidden="true">
                  <line id="sparkZero" x1="0" x2="300" y1="58" y2="58"></line>
                  <polyline id="sparkPath" points=""></polyline>
                </svg>
                <div class="bar">
                  <span id="barPos" class="bar-seg bar-seg--pos"></span>
                  <span id="barNeg" class="bar-seg bar-seg--neg"></span>
                </div>
                <div id="postActions" class="post-actions"></div>
              </article>
            </div>
            <aside class="timeline" id="timelinePanel" hidden>
              <h2 class="section-title" data-i18n="section.timeline">Timeline</h2>
              <ol id="timeline" class="timeline-list"></ol>
            </aside>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ WEIGHTS ============ -->
    <section id="panel-weights" class="panel" role="tabpanel" hidden>
      <div class="weights-layout" id="weightsRoot"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
