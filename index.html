<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X Simulator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <span class="topbar-name">X Simulator</span>
    <select class="lang-picker" id="langPicker" aria-label="Language">
      <option value="en">English</option>
      <option value="ja">日本語</option>
    </select>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab tab--active" role="tab" aria-selected="true" data-tab="simulator" data-i18n="tab.simulator">Simulator</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="weights" data-i18n="tab.weights">Weights</button>
  </nav>

  <main>
    <!-- ============ SIMULATOR ============ -->
    <section id="panel-simulator" class="panel" role="tabpanel">
      <div class="layout">
        <aside class="controls">
          <h2 class="section-title" data-i18n="section.account">Account</h2>
          <div class="field">
            <label for="followers" data-i18n="field.followers">Followers</label>
            <input type="number" id="followers" min="0" max="100000000" value="1250">
          </div>
          <div class="field">
            <label for="following" data-i18n="field.following">Following</label>
            <input type="number" id="following" min="0" max="100000000" value="480">
          </div>

          <h2 class="section-title" data-i18n="section.feed">Feed</h2>
          <div class="field">
            <label for="postCount"><span data-i18n="field.postCount">Candidate posts</span> <output id="postCountValue">30</output></label>
            <input type="range" id="postCount" min="10" max="100" step="5" value="30">
          </div>
          <div class="field">
            <label for="duration"><span data-i18n="field.duration">Duration</span> <output id="durationValue">2:00</output></label>
            <input type="range" id="duration" min="30" max="1440" step="30" value="120">
          </div>

          <h2 class="section-title" data-i18n="section.rates">Negative feedback rates</h2>
          <div class="field">
            <label for="rateReport"><span data-i18n="action.report">Report</span> <output id="rateReportValue">0.010%</output></label>
            <input type="range" id="rateReport" min="0" max="100" step="1" value="2">
          </div>
          <div class="field">
            <label for="rateBlock"><span data-i18n="rate.block">Block</span> <output id="rateBlockValue">0.020%</output></label>
            <input type="range" id="rateBlock" min="0" max="100" step="1" value="4">
          </div>
          <div class="field">
            <label for="rateMute"><span data-i18n="rate.mute">Mute</span> <output id="rateMuteValue">0.020%</output></label>
            <input type="range" id="rateMute" min="0" max="100" step="1" value="4">
          </div>
          <div class="field">
            <label for="rateNotInterested"><span data-i18n="action.notInterested">Not interested</span> <output id="rateNotInterestedValue">0.050%</output></label>
            <input type="range" id="rateNotInterested" min="0" max="100" step="1" value="10">
          </div>

          <div class="actions">
            <button id="randomizeRates" class="btn btn--secondary" data-i18n="button.randomize">Randomize rates</button>
            <button id="run" class="btn btn--primary" data-i18n="button.run">Run simulation</button>
          </div>
        </aside>

        <div class="results">
          <div class="clock" id="clock" hidden>
            <span class="clock-time" id="clockTime">0:00:00</span>
            <span class="clock-speed">5×</span>
            <div class="clock-bar"><div class="clock-fill" id="clockFill"></div></div>
          </div>
          <div class="stats" id="stats" hidden>
            <div class="stat"><span class="stat-label" data-i18n="stat.shown">Shown</span><span class="stat-value" id="statShown">-</span></div>
            <div class="stat"><span class="stat-label" data-i18n="stat.suppressed">Suppressed</span><span class="stat-value" id="statSuppressed">-</span></div>
            <div class="stat"><span class="stat-label" data-i18n="stat.inNetwork">In-network</span><span class="stat-value" id="statInNetwork">-</span></div>
            <div class="stat"><span class="stat-label" data-i18n="stat.median">Median score</span><span class="stat-value" id="statMedian">-</span></div>
          </div>
          <div class="results-grid">
            <div id="feed" class="feed">
              <p class="empty" data-i18n="feed.empty">Start a simulation to rank a candidate feed over time.</p>
            </div>
            <aside class="timeline" id="timelinePanel" hidden>
              <h2 class="section-title" data-i18n="section.timeline">Timeline</h2>
              <ol id="timeline" class="timeline-list"></ol>
            </aside>
          </div>
        </div>
      </div>
    </section>

    <!-- ============ WEIGHTS ============ -->
    <section id="panel-weights" class="panel" role="tabpanel" hidden>
      <div class="weights-layout" id="weightsRoot"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
